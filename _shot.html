<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;background:#fff}#f{border:0;display:block}</style></head><body>
<iframe id="f"></iframe>
<script>
var q=new URLSearchParams(location.search);
var page=q.get('p')||'index.html',W=parseInt(q.get('w')||'390',10),H=parseInt(q.get('h')||'844',10);
var anchor=q.get('at'),y=parseInt(q.get('y')||'0',10);
var f=document.getElementById('f'); f.style.width=W+'px'; f.style.height=H+'px'; f.src=page;
f.onload=function(){var d=f.contentDocument,w=f.contentWindow;
 function settle(){
  var k=d.createElement('style');
  k.textContent='*,*::before,*::after{transition:none!important;animation:none!important}';
  d.head.appendChild(k);
  d.documentElement.style.scrollBehavior='auto';
  d.querySelectorAll('.fade-el,.fade-in-load').forEach(function(e){e.classList.add('visible');e.style.opacity='1';e.style.transform='none';});
  var top=y; if(anchor){var el=d.getElementById(anchor); if(el)top=el.getBoundingClientRect().top+w.scrollY;}
  w.scrollTo(0,top);
  var imgs=d.querySelectorAll('img'),p=[];
  for(var i=0;i<imgs.length;i++){if(!imgs[i].complete)p.push(new Promise(function(r){imgs[i].addEventListener('load',r);imgs[i].addEventListener('error',r);}));}
  Promise.all(p).then(function(){setTimeout(function(){document.title='ready';},400);});
 }
 if(d.fonts&&d.fonts.ready)d.fonts.ready.then(settle);else settle();};
</script></body></html>
